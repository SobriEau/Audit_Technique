<app-page-header pageTitle="Audit Technique" [crumbs]="[{ label: 'Audit technique' }]" />

<div class="panel">
  <h2>Le bâtiment</h2>
  <p class="muted">
    Le contexte du bâtiment, utile à la lecture de tout ce qui suit. Ces champs
    s'enregistrent au fur et à mesure.
  </p>

  @for (f of champsContexte; track f.key) {
    <div class="field-row">
      <app-audit-field
        [def]="f"
        [ngModel]="valeurContexte(f)"
        (ngModelChange)="changerContexte(f, $event)"
        [ngModelOptions]="{ standalone: true }"
      />
    </div>
  }
</div>

@for (group of visibleGroups; track group.label) {
  <div class="panel">
    <h2>{{ group.label }}</h2>
    <div class="grid">
      @for (s of group.sections; track s.key) {
        <button type="button" class="card-btn" (click)="navigate(s)">
          <span>{{ s.plural }}</span>
          @if (count(s) !== null) {
            <span class="count">{{ count(s) }}</span>
          }
        </button>
      }
    </div>
  </div>
}

<footer class="muted">
  <button type="button" class="lien" (click)="nav('/glossaire')">
    Glossaire des sigles employés
  </button>
</footer>

<app-page-header pageTitle="Audit Technique" />

<div class="panel">
  <label>Info</label>
  <app-rich-editor [(ngModel)]="info" (ngModelChange)="saveInfo()" />
</div>

<div class="panel">
  <h2>Sections</h2>
  <div class="grid">
    @for (s of sections; track s.key) {
      <button type="button" class="card-btn" (click)="navigate(s)">
        <span>{{ s.plural }}</span>
        @if (count(s) !== null) {
          <span class="count">{{ count(s) }}</span>
        }
      </button>
    }
  </div>
</div>

<app-page-header [showExport]="true" />

<div class="page-header">
  <button class="ghost" (click)="router.navigate(['/home'])">Accueil</button>
  <h2>Audit Technique</h2>
  <button class="ghost" (click)="router.navigate(['/home'])">← Retour</button>
</div>

<div class="section">
  <label>Info</label>
  <app-rich-editor [(ngModel)]="info" (ngModelChange)="saveInfo()" />
</div>

<div class="section">
  <h2>Sections</h2>
  <div class="grid">
    @for (s of sections; track s.key) {
      <div class="card-btn" (click)="navigate(s)">{{ s.label }}</div>
    }
  </div>
</div>

<div class="photo-editor">
  <!-- Hidden native file input -->
  <input
    #fileInput
    type="file"
    accept="image/*"
    multiple
    class="hidden-input"
    (change)="onFilesSelected($event)"
  />

  <button type="button" class="add-btn" (click)="triggerPicker()">
    + Ajouter des photos
  </button>

  @if (photos.length === 0) {
    <p class="empty">Aucune photo ajoutée.</p>
  } @else {
    <ul class="photo-list">
      @for (photo of photos; track photo.name; let i = $index) {
        <li class="photo-item">
          <img
            [src]="photo.data"
            [alt]="photo.name"
            class="photo-thumb"
            (click)="openPhoto(photo)"
            title="Ouvrir en plein écran"
          />
          <button
            type="button"
            class="photo-name"
            (click)="openPhoto(photo)"
            [title]="photo.name"
          >
            {{ photo.name }}
          </button>
          <button
            type="button"
            class="remove-btn"
            (click)="removePhoto(i)"
            title="Supprimer"
            aria-label="Supprimer {{ photo.name }}"
          >
            ✕
          </button>
        </li>
      }
    </ul>
  }
</div>

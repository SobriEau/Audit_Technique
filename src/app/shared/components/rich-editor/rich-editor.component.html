<div class="toolbar">
  <button type="button" (mousedown)="exec($event, 'bold')"><b>B</b></button>
  <button type="button" (mousedown)="exec($event, 'italic')"><i>I</i></button>
  <button type="button" (mousedown)="exec($event, 'underline')"><u>U</u></button>
  <button type="button" (mousedown)="exec($event, 'insertUnorderedList')">• Liste</button>
  <label>
    Couleur
    <input type="color" (change)="execWithValue('foreColor', $event)" />
  </label>
  <label>
    Taille
    <select (change)="execWithValue('fontSize', $event)">
      <option value="2">Petit</option>
      <option value="3" selected>Normal</option>
      <option value="5">Grand</option>
    </select>
  </label>

  <span class="toolbar-sep" aria-hidden="true"></span>

  <!-- ── Zone microphone ─────────────────────────────────────────── -->

  @switch (micState) {

    <!-- Modèle non chargé → bouton d'initialisation -->
    @case ('unloaded') {
      <button
        type="button"
        class="mic-btn mic-init"
        (mousedown)="toggleMic($event)"
        title="Cliquer pour télécharger le modèle de reconnaissance vocale français (~32 Mo, mis en cache)"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15" aria-hidden="true">
          <path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 11a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.93V22h-2v-2.07A8 8 0 0 1 4 12h2z"/>
        </svg>
        Activer la dictée
      </button>
    }

    <!-- Téléchargement en cours → barre de progression indéterminée -->
    @case ('downloading') {
      <span class="mic-progress" aria-live="polite" aria-label="Chargement du modèle vocal en cours">
        <span class="mic-progress-bar mic-progress-bar--indeterminate"></span>
        <span class="mic-progress-label">Chargement du modèle…</span>
      </span>
    }

    <!-- Erreur → bouton réessayer -->
    @case ('error') {
      <button
        type="button"
        class="mic-btn mic-error"
        (mousedown)="retryLoad($event)"
        title="Réessayer le chargement du modèle"
      >
        ⚠ Réessayer
      </button>
    }

    <!-- Non supporté (pas de getUserMedia) -->
    @case ('unsupported') {
      <button type="button" class="mic-btn" disabled title="Microphone non disponible dans ce contexte">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 11a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.93V22h-2v-2.07A8 8 0 0 1 4 12h2z"/>
        </svg>
      </button>
    }

    <!-- Prêt → bouton micro -->
    @case ('idle') {
      <button
        type="button"
        class="mic-btn"
        (mousedown)="toggleMic($event)"
        title="Dicter en français (hors-ligne)"
        aria-label="Démarrer la dictée"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 11a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.93V22h-2v-2.07A8 8 0 0 1 4 12h2z"/>
        </svg>
      </button>
    }

    <!-- Dictée active → bouton stop (rouge pulsant) + texte provisoire -->
    @case ('listening') {
      <button
        type="button"
        class="mic-btn listening"
        (mousedown)="toggleMic($event)"
        title="Arrêter la dictée"
        aria-label="Arrêter la dictée"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>
      @if (interimText) {
        <span class="interim-text" aria-live="polite">{{ interimText }}</span>
      }
    }

  }
</div>

<div
  #editor
  class="editable"
  contenteditable="true"
  (input)="onContentInput()"
  (blur)="onTouchedFn()"
></div>

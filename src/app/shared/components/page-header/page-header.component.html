<div class="bar bar--brand">
<header class="app-bar">
  <!-- Le logotype porte le nom : il tient lieu de titre. -->
  <h1 class="brand">
    <img
      [src]="logoSobrieau"
      alt="SobriEau — sobriété, efficacité, circularité"
      width="200"
      height="46"
    />
  </h1>

  <div class="partners" aria-label="Partenaires">
    <img [src]="logoCerema" alt="République Française — Cerema, climat et territoires de demain" />
    <img [src]="logoAgro" alt="AgroParisTech Innovation" />
  </div>

  <app-drive-actions />
</header>
</div>

@if (pageTitle) {
  <div class="bar bar--nav">
    <nav class="page-nav">
      <button class="ghost" type="button" (click)="goHome()">Accueil</button>
      <h2>{{ pageTitle }}</h2>
      <button class="ghost" type="button" (click)="goBack()">← Retour</button>
    </nav>
  </div>
}

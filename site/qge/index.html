<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SobriEau — Questionnaire gestionnaire</title>
  <style>h1{margin:0 0 18px;color:#0b566b}.page-header h1{margin:0}.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}body{font-family:Arial,Helvetica,sans-serif;padding:24px;background:#f6f9fb}textarea{width:100%;height:60vh;padding:12px;border-radius:6px;border:1px solid #d6e6ea;box-sizing:border-box}button{background:#0b566b;color:#fff;border:none;padding:10px 12px;border-radius:6px;cursor:pointer}header{margin-bottom:12px}</style>
</head>
<body>
  <div class="page-header">
		<h1>SobriEau</h1>
		<div class="data-tools">
			<button id="importJson" class="import" type="button" disabled>Importer JSON</button>
			<button id="exportJson" class="export" type="button" disabled>Exporter JSON</button>
		</div>
	</div>
  <div class="page-header"><h1>Questionnaire gestionnaire</h1></div>
  <p>Éditez la structure JSON de <strong>Qge</strong>. Sauvegarde automatique dans les cookies via la classe Data.</p>
  <div>
    <textarea id="editor"></textarea>
  </div>
  <p style="margin-top:8px"><button id="save">Enregistrer</button> <button id="back" style="margin-left:8px">Retour</button></p>

  <script src="../shared/Data.js"></script>
  <script>
    const db = new Data('sobrieau',365,false);
    const editor = document.getElementById('editor');
    const snap = db.snapshot();
    editor.value = JSON.stringify(snap.Qge||{}, null, 2);

    document.getElementById('save').addEventListener('click', ()=>{
      try{
        const parsed = JSON.parse(editor.value || '{}');
        db.data.Qge = parsed;
        alert('Qge sauvegardé.');
      }catch(e){alert('JSON invalide: '+e.message)}
    });

    document.getElementById('back').addEventListener('click', ()=> location.href = '../home.html');
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>SobriEau</title>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:32px auto;background:#f6f9fb;color:#222}
		.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
		h1{margin:0 0 18px;color:#0b566b}
		.page-header h1{margin:0}
		.data-tools{display:flex;gap:8px;align-items:center}
		.data-tools button{width:auto;padding:8px 12px;font-size:13px;border-radius:8px;box-shadow:none}
		.data-tools button:hover{transform:none;box-shadow:none}
		.data-tools .import{background:#2b7f8b}
		.data-tools .export{background:#0b566b}
		.card{background:#fff;border-radius:8px;padding:18px;box-shadow:0 6px 18px rgba(11,86,107,0.06)}
		label{display:block;margin-top:12px;font-weight:600;color:#0b566b}
		.editable{min-height:90px;border:1px solid #d6e6ea;border-radius:6px;padding:10px;background:linear-gradient(180deg,#ffffff,#fbfeff);outline:none}
		.editable:empty:before{content:"(cliquez pour éditer du HTML libre...)";color:#9aaeb4}
		/* toolbar styled as header of the editable area (single-line) */
		.toolbar{display:flex;flex-wrap:nowrap;gap:8px;margin:0;padding:8px 10px;background:linear-gradient(180deg,#eef9fb,#e6f4f7);border:1px solid #d6e6ea;border-bottom:0;border-top-left-radius:8px;border-top-right-radius:8px;align-items:center;overflow-x:auto}
		.toolbar::-webkit-scrollbar{height:8px}
		.toolbar::-webkit-scrollbar-thumb{background:rgba(11,86,107,0.12);border-radius:8px}
		.toolbar button{background:transparent;border:1px solid transparent;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:700;color:#074e58;white-space:nowrap}
		.toolbar button:hover{background:rgba(7,78,88,0.06);border-color:rgba(7,78,88,0.08)}
		.toolbar input[type="color"]{width:34px;height:26px;padding:0;border:0;background:transparent}
		.toolbar label{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
		.toolbar select{padding:6px;border-radius:6px;border:1px solid #d6e6ea;background:#fff;min-width:74px}
		/* Make the editable area look attached to the toolbar */
		.editable{min-height:90px;border:1px solid #d6e6ea;border-top:0;border-bottom-left-radius:8px;border-bottom-right-radius:8px;padding:12px;background:#fff}
		.editable:empty:before{content:"(cliquez pour éditer du HTML libre...)";color:#9aaeb4}
		input[type="date"], input[type="text"]{padding:8px;border:1px solid #d6e6ea;border-radius:6px;width:100%;box-sizing:border-box}
		.buttons{margin-top:18px;display:flex;flex-direction:column;gap:12px;width:100%}
		button{background:#0b566b;color:#fff;border:none;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(11,86,107,0.12);transition:transform .12s ease,box-shadow .12s ease;width:100%}
		button:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none}
		button:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(11,86,107,0.16)}
		button.secondary{background:#2b7f8b}
		#btnQge{background:linear-gradient(180deg,#1b7a8b,#0b566b)}
		#btnQus{background:linear-gradient(180deg,#2b8f6f,#167a59)}
		#btnQte{background:linear-gradient(180deg,#8a6ab8,#5b3fa5)}
		.actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-start}
		footer{margin-top:14px;font-size:13px;color:#657b81}
		.small{font-size:13px;color:#53686d;margin-top:6px}
	</style>
</head>
<body>
	<div class="page-header">
		<h1>SobriEau</h1>
		<div class="data-tools">
			<button id="importJson" class="import" type="button">Importer JSON</button>
			<button id="exportJson" class="export" type="button">Exporter JSON</button>
		</div>
	</div>
	<div class="card">
		<div>
			<label>Adresse</label>
			<div class="toolbar" data-target="adresse">
				<button type="button" data-cmd="bold"><b>B</b></button>
				<button type="button" data-cmd="italic"><i>I</i></button>
				<button type="button" data-cmd="underline"><u>U</u></button>
				<button type="button" data-cmd="insertUnorderedList">• Liste</button>
				<label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">Couleur<input type="color" data-cmd="foreColor" style="vertical-align:middle"/></label>
				<label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">Taille
					<select data-cmd="fontSize">
						<option value="2">Petit</option>
						<option value="3" selected>Normal</option>
						<option value="5">Grand</option>
					</select>
				</label>
			</div>
			<div id="adresse" class="editable" contenteditable="true"></div>
		</div>

		<div>
			<label>Info</label>
			<div class="toolbar" data-target="info">
				<button type="button" data-cmd="bold"><b>B</b></button>
				<button type="button" data-cmd="italic"><i>I</i></button>
				<button type="button" data-cmd="underline"><u>U</u></button>
				<button type="button" data-cmd="insertUnorderedList">• Liste</button>
				<label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">Couleur<input type="color" data-cmd="foreColor" style="vertical-align:middle"/></label>
				<label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">Taille
					<select data-cmd="fontSize">
						<option value="2">Petit</option>
						<option value="3" selected>Normal</option>
						<option value="5">Grand</option>
					</select>
				</label>
			</div>
			<div id="info" class="editable" contenteditable="true"></div>
		</div>

		<div>
			<label>Date</label>
			<input id="date" type="date" />
		</div>

		<div>
			<label>Auditeur</label>
			<input id="auditeur" type="text" placeholder="Nom de l'auditeur" />
			<div class="small">Les champs Adresse et Info acceptent du HTML libre (formatage simple).</div>
		</div>

		<div class="actions">
			<div class="buttons">
				<button id="btnQge">Questionnaire gestionnaire</button>
				<button id="btnQus" class="secondary">Questionnaire usager</button>
				<button id="btnQte" class="secondary">Audit Technique</button>
			</div>
		</div>
	</div>

	<footer>Les données sont sauvegardées automatiquement dans un cookie.</footer>

	<script src="./shared/Data.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const db = new Data('sobrieau', 365, false);

			// Initialisation minimale si absent
			const snap = db.snapshot();
			if (!('Adresse' in snap)) db.data.Adresse = null;
			if (!('Info' in snap)) db.data.Info = null;
			if (!('Date' in snap)) db.data.Date = null;
			if (!('Auditeur' in snap)) db.data.Auditeur = null;
			if (!('Qge' in snap)) db.data.Qge = {};
			if (!('Qus' in snap)) db.data.Qus = {};
			if (!('Qte' in snap)) db.data.Qte = {};

			const elAdresse = document.getElementById('adresse');
			const elInfo = document.getElementById('info');
			const elDate = document.getElementById('date');
			const elAud = document.getElementById('auditeur');
			const btnImportJSON = document.getElementById('importJson');
			const btnExportJSON = document.getElementById('exportJson');

			function remplirDepuisSnapshot(snapData){
				elAdresse.innerHTML = snapData.Adresse || '';
				elInfo.innerHTML = snapData.Info || '';
				elAud.value = snapData.Auditeur || '';
				if (snapData.Date) {
				// accepte YYYY-MM-DD ou Date
					const d = new Date(snapData.Date);
				if (!isNaN(d)) {
					const yyyy = d.getFullYear();
					const mm = String(d.getMonth()+1).padStart(2,'0');
					const dd = String(d.getDate()).padStart(2,'0');
					elDate.value = `${yyyy}-${mm}-${dd}`;
				} else {
					// si c'est déjà au format ISO
						elDate.value = snapData.Date;
				}
				} else {
					elDate.value = '';
			}
			}

			// Remplissage initial
			remplirDepuisSnapshot(db.snapshot());

			// Sauvegarde au blur / changement + autosave sur input
			const saveAdresse = () => db.data.Adresse = elAdresse.innerHTML.trim() ? elAdresse.innerHTML : null;
			const saveInfo = () => db.data.Info = elInfo.innerHTML.trim() ? elInfo.innerHTML : null;
			const saveAud = () => db.data.Auditeur = elAud.value.trim() ? elAud.value.trim() : null;
			const saveDate = () => db.data.Date = elDate.value ? elDate.value : null;

			elAdresse.addEventListener('blur', saveAdresse);
			elInfo.addEventListener('blur', saveInfo);
			elAdresse.addEventListener('input', saveAdresse);
			elInfo.addEventListener('input', saveInfo);
			elAud.addEventListener('change', saveAud);
			elDate.addEventListener('change', saveDate);

			// Raccourcis / barre d'outils pour l'édition HTML libre
			let currentEditable = null;
			document.querySelectorAll('.editable').forEach(el => {
				el.addEventListener('focus', () => currentEditable = el);
				el.addEventListener('focusin', () => currentEditable = el);
				el.addEventListener('blur', () => setTimeout(()=>{ currentEditable = null; }, 150));
			});

			function execStyle(cmd, value){
				if (currentEditable) currentEditable.focus();
				try{ document.execCommand(cmd, false, value); } catch(e) { console.warn('execCommand failed', e); }
				// sauvegarde après action
				saveAdresse(); saveInfo();
			}

			// Wire toolbar buttons
			document.querySelectorAll('.toolbar').forEach(tb => {
				tb.addEventListener('click', (ev)=>{
					const btn = ev.target.closest('[data-cmd]');
					if (!btn) return;
					const cmd = btn.getAttribute('data-cmd');
					execStyle(cmd, null);
				});
				tb.querySelectorAll('input[type=color]').forEach(inp => {
					inp.addEventListener('input', (e)=> execStyle(inp.getAttribute('data-cmd'), e.target.value));
				});
				tb.querySelectorAll('select').forEach(sel => {
					sel.addEventListener('change', (e)=> execStyle(sel.getAttribute('data-cmd'), e.target.value));
				});
			});

			// Boutons — ouvrent les pages correspondantes (désactivés si données manquantes)
			const btnQge = document.getElementById('btnQge');
			const btnQus = document.getElementById('btnQus');
			const btnQte = document.getElementById('btnQte');

			function areRequiredFieldsPresent(){
				const s = db.snapshot();
				// Toutes les données sauf 'Info' sont obligatoires : Adresse, Date, Auditeur
				return s && s.Adresse && String(s.Adresse).trim() !== '' && s.Date && String(s.Date).trim() !== '' && s.Auditeur && String(s.Auditeur).trim() !== '';
			}

			function updateButtonsState(){
				const ok = areRequiredFieldsPresent();
				[btnQge, btnQus, btnQte].forEach(b=>{
					b.disabled = !ok;
					b.title = ok ? '' : 'Remplissez Adresse, Date et Auditeur pour activer';
				});
			}

			btnQge.addEventListener('click', () => { if (!btnQge.disabled) location.href = './qge/index.html'; });
			btnQus.addEventListener('click', () => { if (!btnQus.disabled) location.href = './qus/index.html'; });
			btnQte.addEventListener('click', () => { if (!btnQte.disabled) location.href = './qte/index.html'; });
			// Import/Export JSON via Data.js
			btnExportJSON.addEventListener('click', () => {
				saveAdresse();
				saveInfo();
				saveAud();
				saveDate();
				const stamp = new Date().toISOString().slice(0,10);
				db.exporterJSON('sobrieau-' + stamp);
			});

			btnImportJSON.addEventListener('click', () => {
				db.importerJSON((nouvellesDonnees) => {
					remplirDepuisSnapshot(nouvellesDonnees || db.snapshot());
					updateButtonsState();
					alert('Données JSON importées.');
				});
			});

			// met à jour l'état après chargement et à chaque sauvegarde
			updateButtonsState();

			// Écoute externe : si d'autres pages modifient les données
			document.addEventListener('data:change', (ev) => {
				if (!(ev.detail && ev.detail.nom === 'sobrieau')) return;
				const d = ev.detail.data || {};
				// Ne pas écraser le champ en cours d'édition (préserve le curseur)
				if (!(currentEditable && currentEditable.id === 'adresse')) {
					const newAdresse = d.Adresse || '';
					if (elAdresse.innerHTML !== newAdresse) elAdresse.innerHTML = newAdresse;
				}
				if (!(currentEditable && currentEditable.id === 'info')) {
					const newInfo = d.Info || '';
					if (elInfo.innerHTML !== newInfo) elInfo.innerHTML = newInfo;
				}
				if (document.activeElement !== elAud) {
					elAud.value = d.Auditeur || '';
				}
				if (document.activeElement !== elDate) {
					elDate.value = d.Date || '';
				}
				if (typeof updateButtonsState === 'function') updateButtonsState();
			});
		});
	</script>
</body>
</html>

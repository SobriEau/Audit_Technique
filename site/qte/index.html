<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SobriEau — Audit Technique</title>
  <style>h1{margin:0 0 18px;color:#0b566b}.page-header h1{margin:0}.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}body{font-family:Arial,Helvetica,sans-serif;padding:20px;background:#f6f9fb;color:#222;max-width:1000px;margin:18px auto}
    header.main{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    header.main h1{margin:0;color:#0b566b;font-size:20px}
    header.main button{margin-left:auto;background:#0b566b;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    h2{margin:6px 0 12px;color:#09494f}
    .toolbar{display:flex;flex-wrap:nowrap;gap:8px;margin:0;padding:8px 10px;background:linear-gradient(180deg,#eef9fb,#e6f4f7);border:1px solid #d6e6ea;border-bottom:0;border-top-left-radius:8px;border-top-right-radius:8px;align-items:center;overflow-x:auto}
    .toolbar button{background:transparent;border:1px solid transparent;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:700;color:#074e58;white-space:nowrap}
    .editable{min-height:120px;border:1px solid #d6e6ea;border-top:0;border-bottom-left-radius:8px;border-bottom-right-radius:8px;padding:12px;background:#fff}
    .section{background:#fff;padding:14px;border-radius:8px;border:1px solid #e3eef0;margin-bottom:12px}
    .grid{display:flex;flex-direction:column;gap:10px}
    .card-btn{width:100%;background:linear-gradient(180deg,#ffffff,#f3fbfb);border:1px solid #d6e6ea;padding:12px;border-radius:8px;cursor:pointer;color:#074e58;text-align:left;font-weight:700;box-sizing:border-box;overflow-wrap:break-word}
    .card-btn a{color:inherit;text-decoration:none;display:block;width:100%;box-sizing:border-box;white-space:normal;word-break:break-word}
    .muted{color:#576c70;font-size:14px}
    textarea{width:100%;height:220px;padding:12px;border-radius:6px;border:1px solid #d6e6ea;box-sizing:border-box}
    .actions{margin-top:10px}
  button.primary{background:#0b566b;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;border:1px solid #d6e6ea;padding:6px 10px;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <div class="page-header">
		<h1>SobriEau</h1>
		<div class="data-tools">
			<button id="exportJson" class="export" type="button" disabled>Exporter JSON</button>
		</div>
	</div>
  <div class="page-header">
    <button i="home" class="ghost" style="margin-right:auto" onclick="location.href='../home.html'">Accueil</button>
    <h2>Audit Technique</h2>
    <button id="back" class="ghost" style="margin-left:auto">← Retour</button>
  </div>
  <div class="section">
    <div>
      <label style="font-weight:700;margin-bottom:6px;display:block">Info</label>
      <div class="toolbar" data-target="qte-info">
        <button type="button" data-cmd="bold"><b>B</b></button>
        <button type="button" data-cmd="italic"><i>I</i></button>
        <button type="button" data-cmd="underline"><u>U</u></button>
        <button type="button" data-cmd="insertUnorderedList">• Liste</button>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">Couleur<input type="color" data-cmd="foreColor" style="vertical-align:middle"/></label>
        <label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px">Taille
          <select data-cmd="fontSize">
            <option value="2">Petit</option>
            <option value="3" selected>Normal</option>
            <option value="5">Grand</option>
          </select>
        </label>
      </div>
      <div id="qte-info" class="editable" contenteditable="true"></div>
    </div>
  </div>

  <div class="section">
    <h2>Mesure de Pression au point le plus éloigné du réseau (Bar)</h2>
    <div class="grid" id="subitems">
      <!-- buttons injected by script -->
    </div>
  </div>

  <script src="../shared/Data.js"></script>
  <script>
    // mapping affichage -> clé interne
    const displayToKey = {
      "Relevé compteur général": "releve_compteur_general",
      "Sous-compteurs": "sous_compteurs",
      "Réducteurs de pression": "reducteurs_de_pression",
      "Robinets": "robinets",
      "Douches / Baignoires": "douches_baignoires",
      "WC": "wc",
      "Réseaux d'Eau Chaude Sanitaire": "reseaux_eau_chaude_sanitaire",
      "Espace vert / Extérieur": "espace_vert_exterieur",
      "Appareils de nettoyage / lavage": "appareils_nettoyage_lavage",
      "Ventilation du bâtiment": "ventilation_batiment",
      "Potentiel d'optimisation": "potentiel_optimisation"
    };

    const keyToDisplay = Object.fromEntries(Object.entries(displayToKey).map(([k,v])=>[v,k]));

    const items = Object.keys(displayToKey);

    const db = new Data('sobrieau',365,false);

    // init info
    const infoEl = document.getElementById('qte-info');
    infoEl.innerHTML = (db.data.Qte && db.data.Qte.Info) ? db.data.Qte.Info : '';

    // toolbar handling (simple execCommand like on home)
    let currentEditable = infoEl;
    function execStyle(cmd, value){
      if (currentEditable) currentEditable.focus();
      try{ document.execCommand(cmd, false, value); } catch(e) { console.warn(e); }
    }
    document.querySelectorAll('.toolbar').forEach(tb => {
      tb.addEventListener('click', (ev)=>{
        const btn = ev.target.closest('[data-cmd]');
        if (!btn) return;
        execStyle(btn.getAttribute('data-cmd'), null);
      });
      tb.querySelectorAll('input[type=color]').forEach(inp => inp.addEventListener('input', (e)=> execStyle(inp.getAttribute('data-cmd'), e.target.value)));
      tb.querySelectorAll('select').forEach(sel => sel.addEventListener('change', (e)=> execStyle(sel.getAttribute('data-cmd'), e.target.value)));
    });

    // sauvegarde au blur (quitte le champ)
    const saveInfo = ()=>{ db.data.Qte = db.data.Qte || {}; db.data.Qte.Info = infoEl.innerHTML.trim() ? infoEl.innerHTML : null; };
    infoEl.addEventListener('blur', saveInfo);

    // build subitem buttons
    const container = document.getElementById('subitems');
    items.forEach(display => {
      const key = displayToKey[display];
      const div = document.createElement('div');
      div.className = 'card-btn';
      const a = document.createElement('a');
      a.href = './' + key + '.html';
      a.textContent = display;
      div.appendChild(a);
      container.appendChild(div);
    });
	const btnExportJSON = document.getElementById('exportJson');
	// Import/Export JSON via Data.js
	btnExportJSON.addEventListener('click', () => {
		const stamp = new Date().toISOString().slice(0,10);
		db.exporterJSON('sobrieau-' + stamp);
	});

    document.getElementById('back').addEventListener('click', ()=> location.href = '../home.html');
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Relevé compteur général</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:20px;background:#f6f9fb}textarea{width:100%;min-height:360px;padding:12px;border-radius:6px;border:1px solid #d6e6ea;box-sizing:border-box}button{background:#0b566b;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}</style>
</head>
<body>
  <h2>Relevé compteur général</h2>
  <p class="muted">Éditez les données JSON de cette section.</p>
  <textarea id="editor"></textarea>
  <p style="margin-top:10px"><button id="save">Enregistrer</button> <button id="back" style="margin-left:8px">Retour</button></p>

  <script src="../shared/Data.js"></script>
  <script>
    const db = new Data('sobrieau',365,false);
    const key = 'releve_compteur_general';
    const editor = document.getElementById('editor');
    editor.value = JSON.stringify((db.data.Qte && db.data.Qte[key])||{}, null, 2);
    document.getElementById('save').addEventListener('click', ()=>{
      try{ db.data.Qte = db.data.Qte || {}; db.data.Qte[key] = JSON.parse(editor.value||'{}'); alert('sauvegardé'); }catch(e){ alert('JSON invalide: '+e.message); }
    });
    document.getElementById('back').addEventListener('click', ()=> location.href = './index.html');
  </script>
</body>
</html>

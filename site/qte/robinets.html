<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SobriEau — Audit Technique — Robinets</title>
  <style>h1{margin:0 0 18px;color:#0b566b}.page-header h1{margin:0}.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}body{font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:32px auto;padding:20px;background:#f6f9fb;color:#222}
    .toolbar{display:flex;gap:8px;margin-bottom:12px}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{background:#fff;border:1px solid #d6e6ea;padding:12px;border-radius:8px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .field{flex:1 1 200px;display:flex;flex-direction:column}
    label{font-weight:700;color:#0b566b;margin-bottom:6px}
    input[type="text"], input[type="number"], textarea{padding:8px;border:1px solid #d6e6ea;border-radius:6px}
    textarea{min-height:60px}
    .actions{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
    button.primary{background:#0b566b;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;border:1px solid #d6e6ea;padding:6px 10px;border-radius:6px;cursor:pointer}
    .muted{color:#576c70}
  </style>
</head>
<body>
    <div class="page-header">
		<h1>SobriEau</h1>
		<div class="data-tools">
			<button id="exportJson" class="export" type="button">Exporter JSON</button>
		</div>
	</div>
  <div class="page-header">
    <button i="home" class="ghost" style="margin-right:auto" onclick="location.href='../home.html'">Accueil</button>
    <h2>Robinets</h2>
    <button id="back" class="ghost" style="margin-left:auto">← Retour</button>
  </div>

  <p class="muted">Gérez la liste des robinets : ajoutez, modifiez ou supprimez des entrées. Les champs sont enregistrés automatiquement lorsque vous quittez un champ (blur).</p>

  <div class="toolbar">
    <button id="add" class="primary">Ajouter un robinet</button>
  </div>

  <table id="table" style="width:100%;border-collapse:collapse;background:#fff;border:1px solid #d6e6ea;border-radius:8px;overflow:hidden">
    <thead style="background:#f3fbfb">
      <tr>
        <th style="text-align:left;padding:10px;border-bottom:1px solid #e6eef0">Numéro</th>
        <th style="text-align:left;padding:10px;border-bottom:1px solid #e6eef0">Emplacement</th>
        <th style="text-align:left;padding:10px;border-bottom:1px solid #e6eef0">Type</th>
        <th style="text-align:left;padding:10px;border-bottom:1px solid #e6eef0">Débit (l/min)</th>
        <th style="text-align:left;padding:10px;border-bottom:1px solid #e6eef0">Remarques</th>
        <th style="text-align:left;padding:10px;border-bottom:1px solid #e6eef0;width:200px">Actions</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="../shared/Data.js"></script>
  <script>
    let db = new Data('sobrieau',365,false);
    const key = 'robinets';

    function getData(){
      // Toujours lire depuis db.data actuel, pas de cache
      if (!db.data.Qte || !Array.isArray(db.data.Qte[key])) {
        return [];
      }
      return db.data.Qte[key];
    }

    const tbody = document.getElementById('tbody');

    function saveList(arr){ db.data.Qte = db.data.Qte || {}; db.data.Qte[key] = arr; }

    function render(){
      const arr = getData();
      tbody.innerHTML = '';
      arr.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const td = (text) => { const c = document.createElement('td'); c.style.padding='10px'; c.style.borderBottom='1px solid #eef6f7'; c.innerHTML = text||''; return c; };
        tr.appendChild(td(item.Numero || ''));
        tr.appendChild(td(item.Emplacement || ''));
        tr.appendChild(td(item.Type || ''));
        tr.appendChild(td(item.Debit!=null? item.Debit : ''));
        tr.appendChild(td(item.Remarques || ''));
        const actionsTd = document.createElement('td'); actionsTd.style.padding='10px'; actionsTd.style.borderBottom='1px solid #eef6f7';
        // Modifier button
        const mod = document.createElement('button'); mod.className='ghost'; mod.textContent='Modifier'; mod.style.marginRight='8px';
        mod.addEventListener('click', ()=>{
          // Stocker l'index pour éviter "index invalide" après actualisation
          localStorage.setItem('currentRobinetIdx', idx);
          location.href = './robinet.html?idx='+idx;
        });
        const del = document.createElement('button'); del.className='ghost'; del.textContent='Supprimer';
        del.addEventListener('click', ()=>{ if (confirm('Supprimer ce robinet ?')){ arr.splice(idx,1); saveList(arr); render(); } });
        actionsTd.appendChild(mod); actionsTd.appendChild(del);
        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      });
    }

    document.getElementById('add').addEventListener('click', ()=>{
      const arr = getData();
      arr.push({Numero:null,Emplacement:null,Type:null,Debit:null,Remarques:null});
      saveList(arr);
      // Stocker l'index pour éviter "index invalide" après actualisation
      const newIdx = arr.length - 1;
      localStorage.setItem('currentRobinetIdx', newIdx);
      
      // Attendre un instant pour que la sauvegarde soit bien persistée
      setTimeout(() => {
        location.href = './robinet.html?idx=' + newIdx;
      }, 50);
    });

    document.getElementById('back').addEventListener('click', ()=> location.href = './index.html');

    // Fonction load() appelée automatiquement quand la section devient visible
    function load(){
      // Recréer l'instance pour forcer le rechargement depuis localStorage
      db = new Data('sobrieau',365,false);
      render();
    }
    const btnExportJSON = document.getElementById('exportJson');
			// Import/Export JSON via Data.js
			btnExportJSON.addEventListener('click', () => {
				const stamp = new Date().toISOString().slice(0,10);
				db.exporterJSON('sobrieau-' + stamp);
			});
    // initial render
    load();
  </script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Éditeur Robinet</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:20px;background:#f6f9fb;color:#222}
    label{display:block;margin-top:10px;font-weight:700;color:#0b566b}
    input[type=text], input[type=number], textarea, select{width:100%;padding:8px;border:1px solid #d6e6ea;border-radius:6px;box-sizing:border-box}
    textarea{min-height:100px}
    .row{max-width:800px}
    .pair{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
    .pair .col{flex:1 1 220px;display:flex;flex-direction:column;min-width:0}
    .checkbox-label{display:flex;align-items:center;gap:8px}
    .actions{margin-top:12px;display:flex;gap:8px}
    button.primary{background:#0b566b;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;border:1px solid #d6e6ea;padding:6px 10px;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <header style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
    <h2 style="margin:0;color:#0b566b">Éditeur Robinet</h2>
    <button id="back" class="ghost" style="margin-left:auto">← Retour</button>
  </header>

  <div class="row">
    <label>Numéro</label>
    <input id="numero" type="text" />

    <label>Emplacement</label>
    <input id="emplacement" type="text" />

    <label>Précision emplacement</label>
    <input id="precision" type="text" />

    <div class="pair">
      <div class="col">
        <label>Type</label>
        <select id="type">
          <option value=""></option>
          <option value="Mitigeur">Mitigeur</option>
          <option value="Mélangeur">Mélangeur</option>
          <option value="Monocommande">Monocommande</option>
          <option value="Robinet à bille">Robinet à bille</option>
          <option value="Robinet à disque céramique">Robinet à disque céramique</option>
          <option value="Robinet thermostatique">Robinet thermostatique</option>
          <option value="Robinet temporisé">Robinet temporisé</option>
          <option value="Robinet d'arrêt">Robinet d'arrêt</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="col">
        <label>Usages</label>
        <input id="usages" type="text" />
      </div>
    </div>

    <div class="pair">
      <div class="col">
        <label>Débit (l/min)</label>
        <input id="debit" type="number" step="0.1" />
      </div>
      <div class="col">
        <label>Présence d'un réducteur de débit</label>
        <select id="reducteur">
          <option value=""></option>
          <option value="true">Oui</option>
          <option value="false">Non</option>
        </select>
      </div>
    </div>

    <div class="pair">
      <div class="col">
        <label>Temps obtention ECS (s)</label>
        <input id="tempsECS" type="number" step="1" />
      </div>
      <div class="col">
        <label>Numéro réseau ECS d'appartenance</label>
        <input id="numReseauECS" type="text" />
      </div>
    </div>

    <div class="pair">
      <div class="col">
        <label>Nombre d'utilisation / semaine</label>
        <input id="nbUtilSemaine" type="number" step="1" />
      </div>
      <div class="col">
        <label>Nombre d'équipement identique</label>
        <input id="nbEquipIdentique" type="number" step="1" />
      </div>
    </div>

    <label>Remarques</label>
    <textarea id="remarques"></textarea>

    <div class="actions">
      <button id="save" class="primary">Enregistrer</button>
      <button id="del" class="ghost">Supprimer</button>
    </div>
  </div>

  <script src="../shared/Data.js"></script>
  <script>
    
    // initialisation du stockage et paramètres
    const db = new Data('sobrieau',365,false);
    const key = 'robinets';
    const params = new URLSearchParams(location.search);
    
    // Fonction pour récupérer l'index actuel (appelée à chaque load)
    function getCurrentIdx() {
      if (window.__robinetIdx !== undefined) {
        // 1. Variable globale définie par navigation SPA
        return window.__robinetIdx;
      } else if (localStorage.getItem('currentRobinetIdx')) {
        // 2. localStorage (persiste après actualisation)
        return parseInt(localStorage.getItem('currentRobinetIdx'), 10);
      } else {
        // 3. URLSearchParams (mode standalone)
        return parseInt(params.get('idx'), 10);
      }
    }

    function load(){
      // Recalculer l'index à chaque chargement
      const idx = getCurrentIdx();
      
      db.data.Qte = db.data.Qte || {};
      if (!Array.isArray(db.data.Qte[key])) db.data.Qte[key] = [];
      const arr = db.data.Qte[key];
      if (!Number.isInteger(idx) || idx < 0 || idx >= arr.length){
        alert('Index invalide');
        // Nettoyer le localStorage si l'index est invalide
        localStorage.removeItem('currentRobinetIdx');
        location.href = './robinets.html';
        return;
      }
      const item = arr[idx] || {};
        document.getElementById('numero').value = item.Numero || '';
        document.getElementById('emplacement').value = item.Emplacement || '';
        document.getElementById('precision').value = item.PrecisionEmplacement || '';
        document.getElementById('type').value = item.Type || '';
        document.getElementById('usages').value = item.Usages || '';
        document.getElementById('debit').value = item.Debit != null ? item.Debit : '';
        // PresenceReducteur stored as boolean; map to select value 'true'/'false' or ''
        const redEl = document.getElementById('reducteur');
        if (redEl) {
          if (item.PresenceReducteur === true) redEl.value = 'true';
          else if (item.PresenceReducteur === false) redEl.value = 'false';
          else redEl.value = '';
        }
        document.getElementById('tempsECS').value = item.TempsECS != null ? item.TempsECS : '';
        document.getElementById('numReseauECS').value = item.NumeroReseauECS || '';
        document.getElementById('nbUtilSemaine').value = item.NbUtilisationSemaine != null ? item.NbUtilisationSemaine : '';
        document.getElementById('nbEquipIdentique').value = item.NbEquipementIdentique != null ? item.NbEquipementIdentique : '';
        document.getElementById('remarques').value = item.Remarques || '';
    }

    function save(notify = false){
      // Récupérer l'index actuel pour la sauvegarde
      const idx = getCurrentIdx();
      const arr = db.data.Qte[key];
      arr[idx] = {
        Numero: document.getElementById('numero').value.trim() || null,
        Emplacement: document.getElementById('emplacement').value.trim() || null,
        PrecisionEmplacement: document.getElementById('precision').value.trim() || null,
        Type: document.getElementById('type').value.trim() || null,
        Usages: document.getElementById('usages').value.trim() || null,
        Debit: (document.getElementById('debit').value!=='') ? parseFloat(document.getElementById('debit').value) : null,
        PresenceReducteur: (function(){ const v = document.getElementById('reducteur').value; return v==='true'?true:(v==='false'?false:null); })(),
        TempsECS: (document.getElementById('tempsECS').value!=='') ? parseInt(document.getElementById('tempsECS').value,10) : null,
        NumeroReseauECS: document.getElementById('numReseauECS').value.trim() || null,
        NbUtilisationSemaine: (document.getElementById('nbUtilSemaine').value!=='') ? parseInt(document.getElementById('nbUtilSemaine').value,10) : null,
        NbEquipementIdentique: (document.getElementById('nbEquipIdentique').value!=='') ? parseInt(document.getElementById('nbEquipIdentique').value,10) : null,
        Remarques: document.getElementById('remarques').value.trim() || null
      };
      db.data.Qte[key] = arr;
      if (notify) {
        alert('Enregistré');
        // Nettoyer localStorage et retourner à la liste
        localStorage.removeItem('currentRobinetIdx');
        location.href = './robinets.html';
      }
    }

    document.getElementById('save').addEventListener('click', ()=> save(true));
    document.getElementById('back').addEventListener('click', ()=>{
      // Nettoyer le localStorage avant de retourner
      localStorage.removeItem('currentRobinetIdx');
      location.href = './robinets.html';
    });
    document.getElementById('del').addEventListener('click', ()=>{
      if (!confirm('Supprimer ce robinet ?')) return;
      const idx = getCurrentIdx();
      const arr = db.data.Qte[key]; arr.splice(idx,1); db.data.Qte[key]=arr;
      // Nettoyer le localStorage avant de retourner
      localStorage.removeItem('currentRobinetIdx');
      location.href = './robinets.html';
    });

    // save on blur/change for each field (checkbox uses change)
    ['numero','emplacement','precision','type','usages','debit','tempsECS','numReseauECS','nbUtilSemaine','nbEquipIdentique','remarques'].forEach(id=>{
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('blur', ()=> save(false));
    });
    const reducteurEl = document.getElementById('reducteur');
    if (reducteurEl) reducteurEl.addEventListener('change', ()=> save(false));

    load();
  </script>
</body>
</html>
